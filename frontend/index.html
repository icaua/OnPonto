<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#103C32">
    <meta name="description" content="On Ponto — conferência operacional de arquivos de ponto para escritórios contábeis">
    <meta name="application-version" content="1.0.0-rc.1">
    <title>On Ponto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <a class="skip-link" href="#mainContent">Ir para o conteúdo</a>

    <div id="app" class="app-shell">
      <aside id="appSidebar" class="sidebar" aria-label="Navegação principal"></aside>

      <div class="workspace">
        <header class="topbar">
          <div class="topbar__context">
            <button
              id="sidebarExpandButton"
              class="icon-button topbar__menu-button"
              type="button"
              aria-label="Expandir menu"
              title="Expandir menu"
              hidden
            ></button>
            <div>
              <span class="eyebrow">Ambiente de demonstração</span>
              <strong id="topbarContext" aria-live="polite">Todas as empresas</strong>
            </div>
          </div>

          <div class="topbar__actions">
            <button class="icon-button" type="button" data-action="show-shortcuts" aria-label="Ver atalhos" title="Atalhos de teclado">
              <span aria-hidden="true">?</span>
            </button>
            <button class="icon-button notification-button" type="button" data-action="show-notifications" aria-label="Ver notificações">
              <span aria-hidden="true">●</span>
            </button>
            <div class="user-menu" aria-label="Sessão local">
              <span class="avatar" aria-hidden="true">OP</span>
              <span class="user-menu__copy"><strong>On Ponto</strong><small>MVP RC1 · sessão local</small></span>
            </div>
          </div>
        </header>

        <main id="mainContent" class="main-content" tabindex="-1" aria-live="off"></main>
      </div>
    </div>

    <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <div id="dialogRoot"></div>

    <noscript>
      <div class="noscript-message">O On Ponto precisa de JavaScript habilitado para exibir o protótipo.</div>
    </noscript>

    <script src="js/mocks.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/components.js"></script>
    <script src="js/screens.js"></script>
    <script src="app.js"></script>
  </body>
</html>
